name: Copy Skeptic secrets to Cloudflare Worker

# One-time (re-runnable) transfer of the forecast/Govee API keys from GitHub
# secrets into the skeptic-tracker Worker. Values go GitHub → Cloudflare directly
# and never appear in logs. Needs secret CLOUDFLARE_API_TOKEN (Edit Workers).

on:
  workflow_dispatch:

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Write secrets file
        env:
          GOVEE_API_KEY: ${{ secrets.GOVEE_API_KEY }}
          GOVEE_DEVICE_MAC: ${{ secrets.GOVEE_DEVICE_MAC }}
          GOVEE_DEVICE_SKU: ${{ secrets.GOVEE_DEVICE_SKU }}
          WEATHERAPI_KEY: ${{ secrets.WEATHERAPI_KEY }}
          PIRATE_KEY: ${{ secrets.PIRATE_KEY }}
        run: |
          umask 077
          node -e '
            const keys = ["GOVEE_API_KEY","GOVEE_DEVICE_MAC","GOVEE_DEVICE_SKU","WEATHERAPI_KEY","PIRATE_KEY"];
            const out = {};
            for (const k of keys) if (process.env[k]) out[k] = process.env[k];
            console.log("Copying:", Object.keys(out).join(", "));
            require("fs").writeFileSync("/tmp/secrets.json", JSON.stringify(out));
          '

      - name: Upload to Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 195bc19224058cbd732f811c775b3657
        run: |
          npx -y wrangler@4 secret bulk /tmp/secrets.json --name skeptic-tracker
          rm -f /tmp/secrets.json
